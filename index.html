<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101820" />
  <title>TANK BATTLE</title>
</head>
<body>
  <div id="game-root">
    <canvas id="application-canvas"></canvas>
    <div id="hud">
      <div class="brand">TANK <span>BATTLE</span></div>
      <div class="status">FROZEN RIVER · MULTIPLAYER INTEGRATION TEST</div>
      <div id="network-panel" style="position:absolute;top:54px;right:12px;z-index:10;display:flex;gap:5px;flex-wrap:wrap;max-width:290px;justify-content:flex-end"><input id="server-url" value="ws://localhost:2567" aria-label="Server WebSocket URL" style="width:165px;min-width:0;padding:7px;background:#14212b;color:#fff;border:1px solid #60717b;border-radius:5px"><input id="room-id" value="room-01" aria-label="Room ID" style="width:72px;min-width:0;padding:7px;background:#14212b;color:#fff;border:1px solid #60717b;border-radius:5px"><button id="connect-server">CONNECT</button><button id="start-deployment">START</button></div>
      <div class="combat-hud"><span id="tank-hp">HP 100/100</span><span id="turn-timer">TURN 60s</span></div>
      <div id="help">Drag the left pad to move · Drag AIM to rotate turret · FIRE to test</div>
      <div id="joystick"><div id="stick"></div></div>
      <div id="aim-pad">AIM</div>
      <div class="weapon-panel"><label>WEAPON <select id="weapon"><option value="standard">Standard Shell</option><option value="heavy">Heavy Shell</option><option value="cluster">Cluster Bomb</option></select></label><label>ELEVATION <span id="elevation-value">35°</span><input id="elevation" type="range" min="10" max="80" value="35"></label><label>POWER <span id="power-value">70%</span><input id="power" type="range" min="20" max="100" value="70"></label><button id="fire">FIRE</button><button id="end-turn">END TURN</button></div>
      <div id="message">Prototype ready</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
