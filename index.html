<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101820" />
  <title>TANK BATTLE</title>
</head>
<body>
  <div id="game-root">
    <canvas id="application-canvas"></canvas>
    <div id="hud">
      <div class="brand">TANK <span>BATTLE</span></div>
      <div class="status">VISUAL PROTOTYPE · FROZEN RIVER DEVELOPMENT</div>
      <div id="help">Drag the left pad to move · Drag AIM to rotate turret · FIRE to test</div>
      <div id="joystick"><div id="stick"></div></div>
      <div id="aim-pad">AIM</div>
      <button id="fire">FIRE</button>
      <div id="message">Prototype ready</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
